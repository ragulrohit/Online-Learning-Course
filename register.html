<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your LearnSphere account and start learning today.">
  <title>Register - LearnSphere</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>

  <!-- ========== Register Page ========== -->
  <div class="auth-page" data-page="register">
    <div class="register-layout">
      <div class="register-visual">
        <div class="register-visual-overlay">
          <span class="section-badge">Start your journey</span>
          <h2>Learn today.<br>Build your future.</h2>
          <p>Join a community of learners building practical skills for the real world.</p>
        </div>
      </div>
      <div class="auth-container">
      <div class="auth-logo">
        <a href="index.html">
          <img src="images/Stackly_logo.png" alt="Stackly" class="brand-logo">
        </a>
        <a href="index.html" style="display:block; font-size:0.85rem; color:var(--text-muted); margin-top:4px;">← Back to Home</a>
      </div>

      <a href="index.html" class="register-back-home">← Back to Home</a>
      <h1 class="auth-title">Create Your Account</h1>
      <p class="auth-subtitle">Join thousands of learners and start your journey</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="reg-name">Full Name</label>
          <input type="text" id="reg-name" placeholder="John Doe" autocomplete="name">
          <div class="error-message" id="name-error"></div>
        </div>

        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" placeholder="you@example.com" autocomplete="email">
          <div class="error-message" id="email-error"></div>
        </div>

        <div class="form-group">
          <label for="reg-phone">Phone Number</label>
          <input type="tel" id="reg-phone" placeholder="+1 (555) 123-4567" autocomplete="tel">
          <div class="error-message" id="phone-error"></div>
        </div>

        <div class="form-group">
          <label for="reg-role">Select Role</label>
          <select id="reg-role">
            <option value="">Choose your role</option>
            <option value="student">Student</option>
            <option value="professional">Working Professional</option>
            <option value="instructor">Instructor</option>
          </select>
          <div class="error-message" id="role-error"></div>
        </div>

        <div class="form-group">
          <label for="reg-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="reg-password" placeholder="Minimum 6 characters" autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="reg-password" aria-label="Show password">👁</button>
          </div>
          <div class="error-message" id="password-error"></div>
        </div>

        <div class="form-group">
          <label for="reg-confirm">Confirm Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="reg-confirm" placeholder="Re-enter password" autocomplete="new-password">
            <button type="button" class="password-toggle" data-target="reg-confirm" aria-label="Show confirm password">👁</button>
          </div>
          <div class="error-message" id="confirm-error"></div>
        </div>

        <div class="form-group">
          <label class="form-check" style="margin-bottom:0;">
            <input type="checkbox" id="reg-terms">
            <span>I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy Policy</a></span>
          </label>
          <div class="error-message" style="display:block;" id="terms-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
      </form>

      <div class="auth-divider">OR</div>

      <div class="social-login">
        <button class="btn-google" type="button" onclick="window.location.href='404.html'">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.4-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.22z"/>
            <path fill="#34A853" d="M12 21.56c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.53A9.75 9.75 0 0 0 12 21.56z"/>
            <path fill="#FBBC05" d="M6.53 13.64a5.86 5.86 0 0 1 0-3.28V7.83H3.29a9.76 9.76 0 0 0 0 8.34l3.24-2.53z"/>
            <path fill="#EA4335" d="M12 6.33c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.41 14.63 2.44 12 2.44a9.75 9.75 0 0 0-8.71 5.39l3.24 2.53C7.3 8.05 9.46 6.33 12 6.33z"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <p class="auth-footer">
        Already have an account? <a href="login.html">Login here</a>
      </p>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
