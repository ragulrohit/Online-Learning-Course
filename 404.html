<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - LearnSphere</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="error-page">
  <main class="error-card">
    <img src="../images/Stackly_logo.png" alt="Stackly" class="error-logo">
    <div class="error-number">404</div>
    <div class="error-icon">🔍</div>
    <h1>Oops! Page not found</h1>
    <p>The page or feature you are looking for is not available right now.</p>
    <div class="error-actions">
      <a href="index.html" class="btn btn-primary">Back to Home</a>
      <button type="button" class="btn btn-outline" onclick="history.back()">Go Back</button>
    </div>
  </main>
</body>
</html>
