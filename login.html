<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Login to your LearnSphere account to continue learning.">
  <title>Login - LearnSphere</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/webp" href="images/logo.webp">
</head>
<body>

  <!-- ========== Login Page ========== -->
  <div class="auth-page" data-page="login">
    <div class="register-layout">
      <div class="register-visual">
        <div class="register-visual-overlay">
          <span class="section-badge">Welcome back</span>
          <h2>Keep learning.<br>Keep growing.</h2>
          <p>Continue building practical skills and move closer to your goals every day.</p>
        </div>
      </div>
      <div class="auth-container">
      <div class="auth-logo">
        <a href="index.html">
          <img src="images/Stackly_logo.webp" alt="Stackly" class="brand-logo">
        </a>
        <a href="index.html" style="display:block; font-size:0.85rem; color:var(--text-muted); margin-top:4px;">← Back to Home</a>
      </div>

      <a href="index.html" class="register-back-home">← Back to Home</a>
      <h1 class="auth-title">Welcome Back!</h1>
      <p class="auth-subtitle">Login to continue your learning journey</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email Address</label>
          <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email">
          <div class="error-message" id="email-error"></div>
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password">
            <button type="button" class="password-toggle" data-target="login-password" aria-label="Show password">👁</button>
          </div>
          <div class="error-message" id="password-error"></div>
        </div>

        <div class="form-group">
          <label for="login-role">Select Role</label>
          <select id="login-role">
            <option value="">Choose your role</option>
            <option value="student">Student</option>
            <option value="professional">Working Professional</option>
            <option value="instructor">Instructor</option>
          </select>
          <div class="error-message" id="role-error"></div>
        </div>

        <div class="form-options">
          <label class="form-check">
            <input type="checkbox" id="remember-me">
            <span>Remember me</span>
          </label>
          <a href="404.html" class="form-check">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Login</button>
      </form>

      <div class="auth-divider">OR</div>

      <div class="social-login">
        <button class="btn-google" type="button" onclick="window.location.href='404.html'">
          <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.4-.18-2.05H12v3.88h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.69 2.91-4.18 2.91-7.22z"/>
            <path fill="#34A853" d="M12 21.56c2.63 0 4.84-.87 6.45-2.36l-3.14-2.45c-.87.58-1.98.92-3.31.92-2.54 0-4.7-1.72-5.47-4.03H3.29v2.53A9.75 9.75 0 0 0 12 21.56z"/>
            <path fill="#FBBC05" d="M6.53 13.64a5.86 5.86 0 0 1 0-3.28V7.83H3.29a9.76 9.76 0 0 0 0 8.34l3.24-2.53z"/>
            <path fill="#EA4335" d="M12 6.33c1.43 0 2.71.49 3.72 1.46l2.79-2.79C16.84 3.41 14.63 2.44 12 2.44a9.75 9.75 0 0 0-8.71 5.39l3.24 2.53C7.3 8.05 9.46 6.33 12 6.33z"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <p class="auth-footer">
        Don't have an account? <a href="register.html">Create New Account</a>
      </p>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
